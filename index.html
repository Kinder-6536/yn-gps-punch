        '正在初始化 LINE 登入...':'กำลังเข้าสู่ระบบ LINE...','搜尋姓名、員編、部門':'ค้นหาชื่อ รหัส หรือแผนก'
      }
    };

    function attendanceTranslate(value) {
      return currentLanguage === 'zh' ? value : ((attendanceTranslations[currentLanguage] || {})[value] || value);
    }

    function translateAttendanceDom(root) {
      if (attendanceLanguageObserver) attendanceLanguageObserver.disconnect();
      const target = root && root.nodeType === 1 ? root : document.body;
      const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (!attendanceOriginalText.has(node)) attendanceOriginalText.set(node, node.nodeValue);
        const original = attendanceOriginalText.get(node);
        const trimmed = original.trim();
        if (!trimmed) continue;
        node.nodeValue = original.replace(trimmed, attendanceTranslate(trimmed));
      }
      target.querySelectorAll('input[placeholder]').forEach(function(input) {
        if (!attendanceOriginalPlaceholder.has(input)) attendanceOriginalPlaceholder.set(input, input.placeholder);
        input.placeholder = attendanceTranslate(attendanceOriginalPlaceholder.get(input));
      });
      const select = document.getElementById('languageSelect');
      if (select) select.value = currentLanguage;
      if (attendanceLanguageObserver) attendanceLanguageObserver.observe(document.body, {childList:true,subtree:true});
    }

    function setAttendanceLanguage(language, remember) {
      currentLanguage = ['zh','vi','th'].includes(language) ? language : 'zh';
      if (remember) localStorage.setItem('ynAttendanceLanguage', currentLanguage);
      updateClock();
      translateAttendanceDom(document.body);
    }

    function loadEmployeeLanguagePreference() {
      if (localStorage.getItem('ynAttendanceLanguage')) return;
      callApi('getMyLanguage', {}, function(result) {
        if (!result || !result.success) return;
        const languageMap = {'中文':'zh','越南':'vi','泰國':'th'};
        setAttendanceLanguage(languageMap[result.language] || 'zh', false);
      });
    }

    const menus = {

  ['status', '今日狀態'],

  ['makeup', '補卡申請'],
  ['abnormalEmployee', '異常出勤'],
  ['report', '出勤紀錄'],
  ['overtime', '本月時數'],
  ['feedback', '紀錄查詢']
],
  admin: [
  ['recentAbnormal', '近期異常'],

  ['reviewCenter', '審核系統'],
  ['monthlyHours', '本月時數'],
  ['reportGenerate', '月報匯出'],
  ['employees', '員工名單'],
  ['settings', '出勤月曆']
]
};

    window.onerror = function(message, source, lineno) {
      setStatus('前端錯誤：' + message + '\n行數：' + lineno);
    };
    window.onunhandledrejection = function(event) {
      setStatus('前端錯誤：' + (event.reason && event.reason.message ? event.reason.message : event.reason));
    };
    
    function updateClock() {
      const now = new Date();
      const locale = currentLanguage === 'vi' ? 'vi-VN' : (currentLanguage === 'th' ? 'th-TH' : 'zh-TW');
      document.getElementById('dateText').textContent = now.toLocaleDateString(locale, { year:'numeric', month:'2-digit', day:'2-digit', weekday:'long' });
      document.getElementById('timeText').textContent = now.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
    }

    async function init() {
      try {
        renderMenu();
        renderPunchPage();
        setStatus('版本：0731-overtime-multi\n正在初始化 LINE 登入...');

setStatus('版本：0731-overtime-multi\n準備初始化 LIFF...');

await liff.init({ liffId: LIFF_ID });

setStatus('LIFF 初始化完成，正在確認登入...');

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        accessToken = liff.getAccessToken() || '';
        idToken = liff.getIDToken() || '';
        ready = true;
        loadEmployeeLanguagePreference();
        prefetchPunchLocation();

const autoAction = getActionFromUrl();

if (autoAction) {

    punch(autoAction);

  return;
}

const requestedPage = getPageFromUrl();
if (requestedPage) {

}

setStatus('已取得 LINE 資料，請選擇功能。');

      } catch (error) {

    function getActionFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const action = params.get('action');

        const actionMap = {
        clockin: '上班',
        clockout: '下班',
        out: '外出',
        back: '返回'
    };

  return actionMap[action] || '';
}


    
function getPageFromUrl() {
  const page = new URLSearchParams(window.location.search).get('page') || '';
  const allowed = menus.employee.concat(menus.admin).map(function(item) { return item[0]; });
  return allowed.includes(page) ? page : '';
}

function switchMode(mode) {
      currentMode = mode;
      document.getElementById('employeeTab').classList.toggle('active', mode === 'employee');
      document.getElementById('adminTab').classList.toggle('active', mode === 'admin');
      renderMenu();
      showPage(menus[mode][0][0]);
    }

    function renderMenu() {
      const nav = document.getElementById('bottomNav');
      nav.innerHTML = menus[currentMode].map(function(item, index) {
        return '<button class="nav-item ' + (index === 0 ? 'active' : '') + '" data-page="' + item[0] + '">' + item[1] + '</button>';
      }).join('');

      document.querySelectorAll('.nav-item').forEach(function(button) {
        button.addEventListener('click', function() {
          document.querySelectorAll('.nav-item').forEach(function(item) { item.classList.remove('active'); });
          button.classList.add('active');
          showPage(button.dataset.page);
        });
      });
    }

  renderPlaceholder(titles[page] || '功能', descriptions[page] || '這個功能頁已建立。');

    function renderPunchPage() {
  document.getElementById('panelTitle').textContent = '我要打卡';

  document.getElementById('content').innerHTML =

function removeOvertimeEntry(entryId) {
  const container = document.getElementById('overtimeEntries');
  const entries = container ? container.querySelectorAll('.overtime-entry') : [];

  }

  const entry = container.querySelector('[data-entry-id="' + entryId + '"]');

  if (entry) {
    entry.remove();

  }
}

function renumberOvertimeEntries() {
  const entries = document.querySelectorAll('#overtimeEntries .overtime-entry');

  entries.forEach(function(entry, index) {
    entry.querySelector('.overtime-entry-title').textContent = '第 ' + (index + 1) + ' 筆';
    entry.querySelector('.overtime-remove-btn').style.visibility =
      entries.length > 1 ? 'visible' : 'hidden';
  });
}

function updateOvertimeHours(entryId) {
  const entry = document.querySelector('[data-entry-id="' + entryId + '"]');

  if (!entry) return;

  const startTime = entry.querySelector('.overtime-start').value;
  const endTime = entry.querySelector('.overtime-end').value;
  const output = entry.querySelector('.overtime-hours');

  if (!startTime || !endTime) {
    output.textContent = '時數：請選擇時間';
    return;
  }

  const minutes = overtimeInputToMinutes(endTime) - overtimeInputToMinutes(startTime);

  if (minutes <= 0) {
    output.textContent = '時數：請確認開始與結束時間';
    return;
  }

  output.textContent = '時數：' + (Math.round((minutes / 60) * 100) / 100) + ' 小時';
}

function submitOvertimeApplications() {
  if (overtimeSubmitPending) return;
  if (!ready) {
    setStatus('LINE 尚未初始化完成，請稍候。');
    return;
  }

  const entries = Array.from(document.querySelectorAll('#overtimeEntries .overtime-entry'));

  if (entries.length === 0) {
    setStatus('請至少新增一筆加班申請。');
    return;
  }

  const items = [];

  for (let i = 0; i < entries.length; i++) {
    const entry = entries[i];
    const item = {
      employeeNo: entry.querySelector('.overtime-employee').value,
      overtimeDate: entry.querySelector('.overtime-date').value,
      startTime: entry.querySelector('.overtime-start').value,
      endTime: entry.querySelector('.overtime-end').value,
      reason: entry.querySelector('.overtime-reason').value.trim()
    };

    if (!item.employeeNo || !item.overtimeDate || !item.startTime || !item.endTime || !item.reason) {
      setStatus('第 ' + (i + 1) + ' 筆資料尚未填寫完整。');
      return;
    }

    if (overtimeInputToMinutes(item.endTime) <= overtimeInputToMinutes(item.startTime)) {
      setStatus('第 ' + (i + 1) + ' 筆結束時間必須晚於開始時間。');
      return;
    }

    items.push(item);
  }

  setStatus('正在送出加班申請...');
  overtimeSubmitPending = true;
  const submitButton = document.getElementById('submitOvertimeButton');
  if (submitButton) { submitButton.disabled = true; submitButton.textContent = '送出處理中…'; }

  callApi('submitOvertime', { items: JSON.stringify(items) }, function(result) {
    overtimeSubmitPending = false;
    if (submitButton) { submitButton.disabled = false; submitButton.textContent = '送出加班申請'; }
    setStatus(result.message);

    if (!result.success) {
      alert(result.message || '加班申請送出失敗。');
      return;
    }

    alert(result.message || '加班申請已送出。');

    const container = document.getElementById('overtimeEntries');
    container.innerHTML = '';
    addOvertimeEntry({
      employeeNo: overtimeApplicant.employeeNo,
      overtimeDate: getTodayInputValue()
    });
  });
}

function overtimeInputToMinutes(value) {
  const parts = String(value || '').split(':').map(Number);
  return parts.length === 2 ? parts[0] * 60 + parts[1] : 0;
}

function getTodayInputValue() {
  const now = new Date();
  return now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
}

function escapeOvertimeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function downloadMonthlyHoursExcel() {
  const month = document.getElementById('hoursMonth').value;
  const employeeNo = document.getElementById('hoursEmployee').value;
  if (!month) return setStatus('請先選擇月份。');
  setStatus('正在整理 Excel…');
  callApi('getAdminMonthlyHoursExport', {month:month, employeeNo:employeeNo}, function(result) {
    if (!result || !result.success) return setStatus((result && result.message) || '下載資料失敗。');
    const headers = ['日期','員工編號','姓名','部門','上班時間','下班時間','出勤時數','狀態','異常原因','加班分鐘'];
    const values = (result.rows || []).map(function(r) { return [r.date,r.employeeNo,r.name,r.department,r.clockIn,r.clockOut,r.hours,r.status,r.reason,r.overtimeMinutes]; });
    const escapeXml = function(value) { return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    const rowsXml = [headers].concat(values).map(function(row) { return '<Row>' + row.map(function(value) { return '<Cell><Data ss:Type="String">' + escapeXml(value) + '</Data></Cell>'; }).join('') + '</Row>'; }).join('');
    const xml = '<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="本月時數"><Table>' + rowsXml + '</Table></Worksheet></Workbook>';
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([xml], {type:'application/vnd.ms-excel;charset=utf-8'}));
    const selected = document.getElementById('hoursEmployee');
    const person = employeeNo ? String(selected.options[selected.selectedIndex].text || employeeNo).split('｜')[0] : '全部員工';
    link.download = month + '-' + person + '-本月時數.xls';
    link.click();
    URL.revokeObjectURL(link.href);
    setStatus('Excel 已下載，共 ' + values.length + ' 筆。');
  });
}

function isLateClockIn(timeText) {
  if (!timeText || timeText === '未打卡') {
    return false;
  }

  const parts = timeText.split(':');
  const minutes = Number(parts[0]) * 60 + Number(parts[1]);

  return minutes >= (8 * 60 + 11);
}

function buildAdminEmployeeFilter(elementId, rows) {

  const options = ['<option value="">全部人員</option>'];
  const seen = {};

  rows.forEach(function(row) {
    const employeeNo = String(row.employeeNo || '').trim();
    const name = String(row.name || '').trim();
    const department = String(row.department || '').trim();

    if (!employeeNo || seen[employeeNo]) return;
    seen[employeeNo] = true;

    options.push(
      '<option value="' + escapeOvertimeHtml(employeeNo) + '">' +
      escapeOvertimeHtml(name + '｜' + employeeNo + '｜' + department) +

  });

  select.innerHTML = options.join('');
}

function getAdminFilteredRows(rows, employeeValue, keyword) {
  const normalizedKeyword = normalizeAdminKeyword(keyword);

  return rows.filter(function(row) {
    const employeeMatched = !employeeValue || String(row.employeeNo || '') === employeeValue;

    if (!employeeMatched) return false;

    if (!normalizedKeyword) return true;

    const haystack = [
      row.date,
      row.employeeNo,
      row.name,
      row.department,
      row.clockIn,
      row.clockOut,
      row.reason
    ].join(' ');

    return normalizeAdminKeyword(haystack).indexOf(normalizedKeyword) !== -1;
  });
}

function buildPunchTypeOptionHtml(selectedValue) {
  return [
    ['上班', '上班'],
    ['下班', '下班'],
    ['上下班', '上班 + 下班']
  ].map(function(option) {
    return '<option value="' + option[0] + '"' + (selectedValue === option[0] ? ' selected' : '') + '>' + option[1] + '</option>';

function normalizePunchTypeForEdit_(value) {
  const text = String(value || '').trim();
  if (text === '上班 + 下班' || text === '上下班') return '上下班';
  if (text === '下班') return '下班';
  return '上班';
}

function formatInputDateValue(text) {
  return String(text || '').trim().replace(/\//g, '-');
}

function syncMakeupEditTimeInputs(index) {
  const typeEl = document.getElementById('record-edit-punch-type-' + index);
  const clockInWrap = document.getElementById('record-edit-clockin-wrap-' + index);
  const clockOutWrap = document.getElementById('record-edit-clockout-wrap-' + index);
  if (!typeEl || !clockInWrap || !clockOutWrap) return;

  const punchType = typeEl.value;
  const showClockIn = punchType === '上班' || punchType === '上下班';
  const showClockOut = punchType === '下班' || punchType === '上下班';

  clockInWrap.classList.toggle('hidden', !showClockIn);
  clockOutWrap.classList.toggle('hidden', !showClockOut);
}

function saveRequestEdit(index) {
  const item = myRequestRecords[index];
  if (!item) {
    setStatus('找不到這筆申請資料。');
    return;
  }

  const requestDate = (document.getElementById('record-edit-date-' + index)?.value || '').trim();
  const reason = (document.getElementById('record-edit-reason-' + index)?.value || '').trim();

  if (!requestDate) {
    setStatus('請先填寫日期。');
    return;
  }

  if (!reason) {
    setStatus('請先填寫事由。');
    return;
  }

  const params = {
    requestKind: item.requestKind || '',
    requestId: item.requestId || '',
    requestTime: item.requestTime || '',
    originalRequestDate: item.requestDate || '',
    originalRequestPeriod: item.requestPeriod || '',
    requestDate: requestDate,
    reason: reason
  };

  if (item.requestKind === 'overtime') {
    const startTime = (document.getElementById('record-edit-start-' + index)?.value || '').trim();
    const endTime = (document.getElementById('record-edit-end-' + index)?.value || '').trim();

    if (!startTime || !endTime) {
      setStatus('請完整填寫加班開始與結束時間。');
      return;
    }

    params.startTime = startTime;
    params.endTime = endTime;
  } else if (item.requestKind === 'makeup') {
    const punchType = (document.getElementById('record-edit-punch-type-' + index)?.value || '').trim();
    const clockInTime = (document.getElementById('record-edit-clockin-' + index)?.value || '').trim();
    const clockOutTime = (document.getElementById('record-edit-clockout-' + index)?.value || '').trim();

    if (!punchType) {
      setStatus('請選擇補卡類型。');
      return;
    }

    if ((punchType === '上班' || punchType === '上下班') && !clockInTime) {
      setStatus('請填寫上班時間。');
      return;
    }

    if ((punchType === '下班' || punchType === '上下班') && !clockOutTime) {
      setStatus('請填寫下班時間。');
      return;
    }

    params.punchType = punchType;
    params.clockInTime = clockInTime;
    params.clockOutTime = clockOutTime;
  } else {
    setStatus('這筆申請目前不支援修改。');
    return;
  }

  callApi('updateMyRequest', params, function(result) {
    setStatus(result.message);
    if (result.success) {
      requestEditIndex = -1;
      renderFeedbackPage();
    }
  });
}

function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
    
    function bindPunchButtons() {
      document.querySelectorAll('.punch-btn').forEach(function(button) {
        button.addEventListener('click', function() {
          punch(button.dataset.action);
        });
      });
    }

    function prefetchPunchLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function(position) {
        cachedPunchPosition = position;
        cachedPunchPositionAt = Date.now();
      }, function() {}, { enableHighAccuracy:true, timeout:20000, maximumAge:30000 });
    }

    function punch(punchAction) {
      if (!ready) return setStatus('LINE 尚未初始化完成，請稍候。');
      setButtonsDisabled(true);
      if (cachedPunchPosition && Date.now() - cachedPunchPositionAt < 60000 && cachedPunchPosition.coords.accuracy <= 100) {
        setStatus('正在送出打卡...');
        submitPunch(punchAction, cachedPunchPosition.coords);
        prefetchPunchLocation();
        return;
      }
      setStatus('正在取得 GPS 位置...');

      navigator.geolocation.getCurrentPosition(
        function(position) {
          cachedPunchPosition = position;
          cachedPunchPositionAt = Date.now();
          submitPunch(punchAction, position.coords);
        },
        function(error) {
          setButtonsDisabled(false);
          setStatus('定位失敗：請確認 LINE 已允許定位權限。\n' + error.message);
        },
        { enableHighAccuracy:true, timeout:20000, maximumAge:0 }
      );
    }

    function submitPunch(punchAction, coords) {
      if (!FAST_PUNCH_ENABLED) return submitPunchAppsScript(punchAction, coords);
      const callbackName = 'awsPunchCallback_' + Date.now();
      let completed = false;
      window[callbackName] = function(result) {
        completed = true;
        delete window[callbackName];
        if (result && result.fallback) return submitPunchAppsScript(punchAction, coords);
        setStatus(result && result.success ? buildPunchSuccessMessage(result.message) : ((result && result.message) || '打卡失敗。'));
        setButtonsDisabled(false);
      };
      const params = new URLSearchParams({callback:callbackName,action:punchAction,accessToken:accessToken,idToken:idToken,targetUserId:selectedPunchTargetUserId,latitude:coords.latitude,longitude:coords.longitude,accuracy:coords.accuracy});
      const script = document.createElement('script');
      script.src = AWS_PUNCH_URL + '&' + params.toString();
      script.onerror = function() {
        if (completed) return;
        delete window[callbackName];
        submitPunchAppsScript(punchAction, coords);
      };
      document.body.appendChild(script);
    }

    function submitPunchAppsScript(punchAction, coords) {
      const callbackName = 'jsonpCallback_' + Date.now();

      window[callbackName] = function(result) {
  if (result.success) {
    setStatus(buildPunchSuccessMessage(result.message));
  } else {
    setStatus(result.message);
  }

  setButtonsDisabled(false);
  delete window[callbackName];
};

      const params = new URLSearchParams({
  api:'submitPunch',
  callback:callbackName,
  action:punchAction,
  accessToken:accessToken,
  idToken:idToken,
  targetUserId:selectedPunchTargetUserId,
  latitude:coords.latitude,
  longitude:coords.longitude,
  accuracy:coords.accuracy
});

      const script = document.createElement('script');
      script.src = APPS_SCRIPT_URL + '?' + params.toString();
      script.onerror = function() {
        setStatus('送出失敗：無法連線到 Apps Script。');
        setButtonsDisabled(false);
      };
      document.body.appendChild(script);
    }

    function buildPunchSuccessMessage(message) {
  const text = String(message || '');

  const firstLine = text.split('\n')[0] || '';
  const timeMatch = text.match(/時間[:：]\s*(.+)/);
  const placeMatch = text.match(/地點[:：]\s*(.+)/);
  const distanceMatch = text.match(/距離[:：]\s*(.+)/);

  const time = timeMatch ? timeMatch[1] : '';
  const place = placeMatch ? placeMatch[1] : '';
  const distance = distanceMatch ? distanceMatch[1] : '';

  return firstLine + '\n' +
    '時間：' + time + '\n' +
    '地點：' + place + '\n' +
    '距離：' + distance + '\n\n' +

    'Vietnamese\n' +
    'Chấm công thành công\n' +
    'Thời gian: ' + time + '\n' +
    'Địa điểm: ' + place + '\n' +
    'Khoảng cách: ' + distance + '\n\n' +

    'Thai\n' +
    'ลงเวลาสำเร็จ\n' +
    'เวลา: ' + time + '\n' +
    'สถานที่: ' + place + '\n' +
    'ระยะทาง: ' + distance;
}

    setStatus('退回請填寫原因。');
    return;
  }

  callApi('reviewMakeup', {
    requestId: requestId,
    decision: decision,
    note: note || ''
  }, function(result) {
    setStatus(result.message);

    if (result.success) {
      renderMakeupReviewPage();
    }
  });
}

function callApi(apiName, extraParams, callback) {
  if (!ready) {
    setStatus('LINE 尚未初始化完成，請稍候。');
    return;
  }

  const callbackName = 'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);

  window[callbackName] = function(result) {
    delete window[callbackName];
    callback(result);
  };

  const params = new URLSearchParams(Object.assign({
    api: apiName,
    callback: callbackName,
    accessToken: accessToken,
    idToken: idToken
  }, extraParams || {}));

  const fastReadApis = [
    'getAdminTodayAttendance',
    'getEmployeeOptions',
    'getOvertimeFormData',
    'getPendingOvertime',
    'getPendingMakeup',
    'getMyRequestRecords',
    'getRecentPunchRecords',
    'getPunchTargets',
    'getMyMonthlyHoursSummary',
    'getMonthlyHoursSummary',
    'getAdminMonthlyAbnormal'
    ,'getAdminHistoricalAbnormal','getAdminMonthlyReport','getAdminMonthlyHoursExport','getAdminEmployeeRoster','getAdminAttendanceCalendar','getMyLanguage'
  ];
  const script = document.createElement('script');
  script.src = fastReadApis.includes(apiName)
    ? AWS_ATTENDANCE_READ_URL + '&' + params.toString()
    : APPS_SCRIPT_URL + '?' + params.toString();
  script.onerror = function() {
    if (fastReadApis.includes(apiName)) {
      script.remove();
      const fallback = document.createElement('script');
      fallback.src = APPS_SCRIPT_URL + '?' + params.toString();
      fallback.onerror = function() { setStatus('查詢連線失敗。'); };
      document.body.appendChild(fallback);
      return;
    }
    setStatus('連線 Apps Script 失敗。');
  };
  document.body.appendChild(script);
}

    
    function setButtonsDisabled(disabled) {
      document.querySelectorAll('.punch-btn').forEach(function(button) { button.disabled = disabled; });
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    attendanceLanguageObserver = new MutationObserver(function(records) {
      records.forEach(function(record) {
        record.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) translateAttendanceDom(node);
          else if (node.nodeType === 3 && node.parentElement) translateAttendanceDom(node.parentElement);
        });
      });
    });
    setAttendanceLanguage(currentLanguage, false);
    attendanceLanguageObserver.observe(document.body, {childList:true,subtree:true});
    updateClock();
    setInterval(updateClock, 1000);
    init();
  </script>
